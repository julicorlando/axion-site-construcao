<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b16">
  <meta name="description" content="Axion Web Digital — estamos preparando algo novo.">
  <title>Axion Web Digital | Em construção</title>
  <style>
    :root { --bg:#080a14; --text:#f7f8ff; --muted:#a7aec9; --purple:#9b5cff; --cyan:#32d8ff; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; }
    body { min-height:100vh; overflow:hidden; color:var(--text); background:var(--bg); font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .scene { position:relative; min-height:100vh; display:grid; place-items:center; padding:32px 20px; isolation:isolate; }
    .scene::before { content:""; position:absolute; inset:0; z-index:-3; background:radial-gradient(circle at 50% 35%, #20204b 0, #0d1022 38%, var(--bg) 78%); }
    .grid { position:absolute; inset:0; z-index:-2; opacity:.24; background-image:linear-gradient(rgba(155,92,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(50,216,255,.12) 1px,transparent 1px); background-size:52px 52px; mask-image:linear-gradient(to bottom,transparent,black 20%,black 80%,transparent); }
    .orb { position:absolute; border-radius:50%; filter:blur(2px); opacity:.46; z-index:-1; animation:float 10s ease-in-out infinite; }
    .orb.one { width:320px; height:320px; top:8%; left:6%; background:#6d35ff; box-shadow:0 0 100px #6d35ff; }
    .orb.two { width:270px; height:270px; right:5%; bottom:8%; background:#00c8ff; box-shadow:0 0 100px #00c8ff; animation-delay:-4s; }
    .card { width:min(760px,100%); text-align:center; padding:clamp(34px,7vw,72px) clamp(22px,6vw,70px); border:1px solid rgba(255,255,255,.16); border-radius:30px; background:rgba(11,13,29,.64); box-shadow:0 30px 100px rgba(0,0,0,.45), inset 0 1px rgba(255,255,255,.08); backdrop-filter:blur(18px); animation:appear .9s ease both; }
    .brand { display:inline-flex; align-items:center; gap:12px; font-size:clamp(1rem,2vw,1.2rem); font-weight:700; letter-spacing:.14em; text-transform:uppercase; }
    .mark { display:grid; place-items:center; width:42px; height:42px; border-radius:13px; color:white; font-size:1.2rem; background:linear-gradient(135deg,var(--purple),var(--cyan)); box-shadow:0 0 30px rgba(117,103,255,.5); }
    h1 { margin:35px 0 16px; font-size:clamp(2.7rem,8vw,5.7rem); line-height:.98; letter-spacing:-.065em; background:linear-gradient(105deg,#fff 20%,#b99aff 55%,#55e7ff 95%); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .lead { max-width:560px; margin:0 auto; color:var(--muted); font-size:clamp(1rem,2vw,1.18rem); line-height:1.7; }
    .status { display:flex; align-items:center; justify-content:center; gap:10px; margin:32px 0 17px; color:#e8eaff; font-size:.92rem; }
    .dot { width:9px; height:9px; border-radius:50%; background:#54e59b; box-shadow:0 0 0 7px rgba(84,229,155,.12),0 0 20px #54e59b; animation:pulse 1.8s infinite; }
    .bar { height:9px; overflow:hidden; border-radius:99px; background:rgba(255,255,255,.1); }
    .bar span { display:block; width:72%; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--purple),var(--cyan)); box-shadow:0 0 22px rgba(50,216,255,.7); animation:load 2.2s ease-out both; }
    .percent { margin-top:10px; color:#7f88aa; font-size:.78rem; letter-spacing:.14em; }
    footer { position:absolute; bottom:24px; color:#69718f; font-size:.78rem; letter-spacing:.08em; }
    @keyframes appear { from { opacity:0; transform:translateY(20px) scale(.98); } to { opacity:1; transform:none; } }
    @keyframes load { from { width:0; } to { width:72%; } }
    @keyframes pulse { 50% { opacity:.45; transform:scale(.8); } }
    @keyframes float { 50% { transform:translate(22px,-24px) scale(1.08); } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; } }
  </style>
</head>
<body>
  <main class="scene">
    <div class="grid"></div><div class="orb one"></div><div class="orb two"></div>
    <section class="card" aria-labelledby="title">
      <div class="brand"><span class="mark">A</span><span>Axion Web Digital - Sua marca, nosso estilo</span></div>
      <h1 id="title">Já pensou uma agência que dá match com a sua marca?</h1>
      <p class="lead">Estamos preparando uma experiência digital mais rápida, moderna e inteligente para você.</p>
      <div class="status"><span class="dot"></span><span>Já estamos chegando!</span></div>
      <div class="bar" aria-label="Progresso da construção"><span></span></div>
      <div class="percent">O FUTURO É HOJE · 67%</div>
    </section>
    <footer>axionwebdigital.com.br</footer>
  </main>
</body>
</html>
